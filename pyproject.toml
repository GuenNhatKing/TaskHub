[project]
name = "taskhub"
version = "0.1.0"
description = "Dự án taskhub"
readme = "README.md"
authors = [
    { name = "GuenNhatKing", email = "guennhatking@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "email-validator>=2.3.0",
    "fastapi[standard]>=0.115.0",
    "psycopg[binary]>=3.3.8",
    "pydantic>=2.12.0",
    "python-dotenv>=1.2.4",
    "sqlalchemy[asyncio]>=2.1.8",
]

[project.scripts]
taskhub = "taskhub:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.fastapi]
entrypoint = "taskhub.main:app"
